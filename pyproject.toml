[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "lerobot-aloha"
version = "0.1.0"
description = "Meta-package: installs all ALOHA LeRobot plugins"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "miyoshi-nii" }]
dependencies = [
    "lerobot-robot-aloha",
    "lerobot-robot-aloha-stationary",
    "lerobot-teleoperator-aloha-leader",
    "lerobot-teleoperator-aloha-stationary-leader",
]

[tool.setuptools]
packages = []

[tool.uv.workspace]
members = [
    "lerobot_robot_aloha",
    "lerobot_robot_aloha_stationary",
    "lerobot_teleoperator_aloha_leader",
    "lerobot_teleoperator_aloha_stationary_leader",
]

[tool.uv.sources]
lerobot-robot-aloha = { workspace = true }
lerobot-robot-aloha-stationary = { workspace = true }
lerobot-teleoperator-aloha-leader = { workspace = true }
lerobot-teleoperator-aloha-stationary-leader = { workspace = true }
