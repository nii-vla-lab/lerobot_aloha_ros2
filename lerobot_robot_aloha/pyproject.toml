[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "lerobot_robot_aloha"
version = "0.1.0"
description = "LeRobot plugin for the ALOHA robot (single arm follower)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "miyoshi-nii" }]
dependencies = [
    "lerobot",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lerobot_robot_aloha*"]

[tool.setuptools.package-dir]
"" = "src"
