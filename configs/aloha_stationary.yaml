# Config for ALOHA Stationary dual-arm teleoperation / recording.
#
# Usage:
#   lerobot-teleoperate --config_path configs/aloha_stationary.yaml --teleop.type=aloha_stationary_leader
#   lerobot-record      --config_path configs/aloha_stationary.yaml --teleop.type=aloha_stationary_leader ...

robot:
  type: aloha_stationary

  # Optional: unique ID to distinguish multiple robots of the same type.
  # Determines the calibration filename: <calibration_dir>/robots/aloha_stationary/<id>.json
  # id: my_aloha_stationary

  # calibration_dir is not required for ALOHA — calibration is managed by Interbotix ROS2.

  # ROS2 robot_name prefix; right/left arms are resolved as <name>_right and <name>_left
  name: "follower"
  # Interbotix robot model
  robot: "aloha_vx300s"
  # Move arms to start pose at the beginning of each episode
  reset_arm_pose: true
  # Move arms to sleep pose and disable torque on disconnect
  shutdown_on: false

  # -----------------------------------------------------------------------
  # Cameras
  # Find your RealSense serial numbers with: rs-enumerate-devices | grep Serial
  # For OpenCV cameras, replace type with "opencv" and set index_or_path.
  # -----------------------------------------------------------------------
  cameras:
    cam_high:
      type: intelrealsense
      serial_number_or_name: "XXXXXXXXXX"  # overhead camera
      width: 640
      height: 480
      fps: 30

    cam_low:
      type: intelrealsense
      serial_number_or_name: "XXXXXXXXXX"  # front-low camera
      width: 640
      height: 480
      fps: 30

    cam_left_wrist:
      type: intelrealsense
      serial_number_or_name: "XXXXXXXXXX"  # left wrist camera
      width: 640
      height: 480
      fps: 30

    cam_right_wrist:
      type: intelrealsense
      serial_number_or_name: "XXXXXXXXXX"  # right wrist camera
      width: 640
      height: 480
      fps: 30
