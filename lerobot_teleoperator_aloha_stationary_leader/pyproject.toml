[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_teleoperator_aloha_stationary_leader"
version = "0.1.0"
description = "LeRobot plugin for the ALOHA Stationary leader arm teleoperator (dual arm)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "miyoshi-nii" }]
dependencies = [
    "lerobot",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lerobot_teleoperator_aloha_stationary_leader*"]

[tool.setuptools.package-dir]
"" = "src"
